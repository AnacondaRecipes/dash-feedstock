{% set name = "dash" %}
{% set version = "4.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 950964e22c21485edc50c36d5c139d95316d94b11348ea3e77f99acc2456b43d
  - url: https://github.com/plotly/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 801259a6dbbc3dce1750ad7527cd0a1aa1dee64c98d23d0f07afc189b2085785
    folder: gh_src

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - dash-generate-components = dash.development.component_generator:cli
    - dash-update-components = dash.development.update_components:cli
    - renderer = dash.development.build_process:renderer
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - flask >=1.0.4,<3.2
    # compress extra
    - flask-compress >=1.6.0
    - werkzeug <3.2
    - plotly >=5.0.0
    - importlib-metadata
    - typing_extensions >=4.1.1
    - requests
    - retrying
    - nest-asyncio
    - janus >=1.0.0
    - pydantic >=2.10.0
    - comm
  run_constrained:
    # Obsolete components now included in dash. In components folder.
    - dash-core-components >=4.0.0
    - dash-html-components >=4.0.0
    - dash-table ==7.0.0
    # extra == "ci"
    - black ==22.3.0
    - flake8 ==7.3.0
    - flaky ==3.8.1
    - flask-talisman ==1.1.0
    # This dependency is broken in `plotly-resampler 0.11.1`
    # Please do not uncomment it before you are sure that the dependency is fixed in `plotly-resampler 0.11.2` or later.
    # - ipython <9.0.0
    - mimesis <=11.1.0        # [py<310]
    - mimesis <=22.2.0        # [py>=310]
    # mock ==5.2.0 is dash's upstream ci.txt pin, but is not available in the
    # main channel (only up to 4.0.3); mock is also in test: requires:, so an
    # unsatisfiable exact run_constrained pin here breaks the test env solve.
    - mock ==4.0.3
    # This dependency is broken in `plotly-resampler 0.11.1`
    # Please do not uncomment it before you are sure that the dependency is fixed in `plotly-resampler 0.11.2` or later.
    # - numpy <=2.5.4
    - orjson >=3.10.11
    - pandas >=1.4.0
    - pylint ==3.0.3
    - pytest-sugar ==1.1.1
    - pyzmq >=26.0.0
    - xlrd >=2.0.1
    - jupyterlab <4.0.0
    - pyright ==1.1.414       # [py>=37]
    - mypy ==1.15.0           # [py>=312]
    # extra == "celery"
    - redis >=3.5.3,<=8.1.0
    - kombu <5.7.0
    - celery >=5.1.2,<5.7.0
    # extra == "diskcache"
    - diskcache >=5.2.1
    - multiprocess >=0.70.12
    - psutil >=5.8.0

# percy_snapshot is a part o percy-selenium which is not in the main channel
# E   ImportError: cannot import name 'percy_snapshot' from 'percy
{% set ignore_tests = " --ignore=tests/unit/test_browser.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/unit/mcp/tools/test_mcp_background_callbacks.py" %}

# selenium.common.exceptions.NoSuchDriverException: Message: Unable to obtain driver for firefox
{% set deselect_tests = " --deselect=tests/unit/test_configs.py::test_missing_flask_compress_raises" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/test_app_runners.py::test_threaded_server_smoke" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/test_app_runners.py::test_process_server_smoke" %}
# E       assert 'style_filter_conditional
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/development/test_dash_table_typing.py::test_datatable_conditional_styles_allow_style_keys" %}
# E       TypeError: issubclass() arg 1 must be a class
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/mcp/tools/test_mcp_enabled_decorator.py::test_mcpd009_typed_param_with_default_not_required" %}  # [py==310]
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/mcp/tools/test_mcp_pattern_matching.py::test_mcpm003_annotation_narrows_value_schema" %}  # [py==310]
# Windows pathing is wrong
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/pages/test_pages.py::test_path_to_module_name" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/pages/test_pages.py::test_import_layouts_from_pages" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=tests/unit/pages/test_pages_config.py::test_pages_folder_config" %}  # [win]

test:
  source_files:
    - gh_src/tests/unit
    - gh_src/tests/conftest.py
    # New in 4.5.0: tests/unit/test_plotly_cli.py reads requirements/install.txt
    # directly off the source tree (Path(__file__).parents[2] / "requirements"),
    # so that file needs to be copied alongside the test files.
    - gh_src/requirements
  imports:
    - dash.dash
    - dash.dependencies
    - dash.exceptions
    - dash.resources
    - dash.dcc
    - dash.html
    - dash.dash_table
  requires:
    - pip
    - pytest
    - pytest-mock
    - coloredlogs
    - fire >=0.4.0
    - percy
    - mock
    - yaml
    # New in 4.5.0: tests/unit/test_app_runners.py directly imports
    # dash.testing.application_runners at module scope (no more guarded
    # try/except like dash.testing.plugin), which needs these to collect
    # even though both of its tests are deselected below.
    - psutil
    - multiprocess
    - selenium
  commands:
    - pip check
    - dash-generate-components --help
    - dash-update-components --help
    - renderer --help
    # tests import as `tests.*`, so pytest must run from gh_src, its parent, not $SRC_DIR
    - cd gh_src && python -m pytest -vv tests {{ ignore_tests }} {{ deselect_tests }}

about:
  home: https://plotly.com/dash
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Python framework for building reactive web-apps.
  description: |
    Built on top of Plotly.js, React and Flask, Dash ties modern UI elements like dropdowns,
    sliders, and graphs directly to your analytical Python code.
  doc_url: https://dash.plotly.com
  dev_url: https://github.com/plotly/dash

extra:
  recipe-maintainers:
    - moorepants
